apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-pedidos
  namespace: agrostock
  labels:
    app: gestion-pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestion-pedidos
  template:
    metadata:
      labels:
        app: gestion-pedidos
    spec:
      containers:
        - name: gestion-pedidos
          image: gestion-pedidos:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: CATALOGO_URL
              value: "http://catalogo-insumos:8081"
            - name: PEDIDOS_TIMEOUT_MS
              value: "2000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-pedidos
  namespace: agrostock
spec:
  type: NodePort
  selector:
    app: gestion-pedidos
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30082
