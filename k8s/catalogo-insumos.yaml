apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-insumos
  namespace: agrostock
  labels:
    app: catalogo-insumos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo-insumos
  template:
    metadata:
      labels:
        app: catalogo-insumos
    spec:
      containers:
        - name: catalogo-insumos
          image: catalogo-insumos:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-insumos
  namespace: agrostock
spec:
  type: NodePort
  selector:
    app: catalogo-insumos
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
